<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kliimaseadus ootab otsust</title>
  <desc id="desc">Editorial illustration of a delayed climate law: grey spring sky, Tallinn skyline, a clock, and a folder labeled kliimaseadus on a desk.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe7eb"/>
      <stop offset="65%" stop-color="#eef1f3"/>
      <stop offset="100%" stop-color="#c8d1d8"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a98967"/>
      <stop offset="100%" stop-color="#7f6349"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d56f"/>
      <stop offset="100%" stop-color="#d7b33c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2b3137" flood-opacity="0.28"/>
    </filter>
    <style>
      .label { font: 700 54px/1.2 "DejaVu Sans", Arial, sans-serif; letter-spacing: 2px; fill: #5d4a11; }
      .sub { font: 400 32px/1.2 "DejaVu Sans", Arial, sans-serif; fill: #7a6527; }
      .top { font: 600 40px/1.2 "DejaVu Sans", Arial, sans-serif; fill: #4a5a63; }
      .small { font: 700 28px/1.2 "DejaVu Sans", Arial, sans-serif; fill: #4d565d; }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Window -->
  <rect x="170" y="100" width="1260" height="520" rx="26" fill="#f8fafb" stroke="#92a0a8" stroke-width="10"/>
  <g opacity="0.55" stroke="#b7c3ca" stroke-width="4">
    <line x1="240" y1="150" x2="210" y2="220"/>
    <line x1="320" y1="170" x2="295" y2="245"/>
    <line x1="410" y1="140" x2="380" y2="210"/>
    <line x1="520" y1="165" x2="488" y2="235"/>
    <line x1="630" y1="150" x2="602" y2="220"/>
    <line x1="735" y1="168" x2="708" y2="245"/>
    <line x1="850" y1="145" x2="820" y2="220"/>
    <line x1="950" y1="170" x2="920" y2="248"/>
    <line x1="1060" y1="150" x2="1034" y2="225"/>
    <line x1="1170" y1="175" x2="1142" y2="250"/>
    <line x1="1280" y1="150" x2="1250" y2="225"/>
  </g>

  <!-- Tallinn skyline -->
  <g fill="#65707a">
    <rect x="245" y="438" width="92" height="120"/>
    <polygon points="245,438 291,408 337,438"/>
    <rect x="355" y="388" width="96" height="170"/>
    <polygon points="355,388 403,355 451,388"/>
    <rect x="470" y="412" width="96" height="146"/>
    <polygon points="470,412 518,382 566,412"/>
    <rect x="585" y="324" width="88" height="234"/>
    <polygon points="585,324 629,284 673,324"/>
    <rect x="690" y="366" width="104" height="192"/>
    <polygon points="690,366 742,337 794,366"/>
    <rect x="817" y="306" width="96" height="252"/>
    <polygon points="817,306 865,265 913,306"/>
    <rect x="930" y="352" width="108" height="206"/>
    <polygon points="930,352 984,321 1038,352"/>
    <rect x="1060" y="390" width="92" height="168"/>
    <polygon points="1060,390 1106,360 1152,390"/>
    <rect x="1170" y="342" width="100" height="216"/>
    <polygon points="1170,342 1220,307 1270,342"/>
  </g>
  <g fill="#e8d56b">
    <rect x="268" y="466" width="10" height="16"/><rect x="288" y="466" width="10" height="16"/><rect x="308" y="466" width="10" height="16"/>
    <rect x="381" y="418" width="10" height="16"/><rect x="401" y="418" width="10" height="16"/><rect x="421" y="418" width="10" height="16"/>
    <rect x="612" y="354" width="10" height="16"/><rect x="632" y="354" width="10" height="16"/><rect x="652" y="354" width="10" height="16"/>
    <rect x="842" y="338" width="10" height="16"/><rect x="862" y="338" width="10" height="16"/><rect x="882" y="338" width="10" height="16"/>
    <rect x="1078" y="417" width="10" height="16"/><rect x="1098" y="417" width="10" height="16"/>
  </g>

  <!-- Wind turbines -->
  <g stroke="#7d8990" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="1210" y1="520" x2="1210" y2="620"/>
    <circle cx="1210" cy="520" r="7" fill="#7d8990" stroke="none"/>
    <line x1="1210" y1="520" x2="1250" y2="497"/>
    <line x1="1210" y1="520" x2="1186" y2="481"/>
    <line x1="1210" y1="520" x2="1169" y2="522"/>
    <line x1="1300" y1="535" x2="1300" y2="620"/>
    <circle cx="1300" cy="535" r="7" fill="#7d8990" stroke="none"/>
    <line x1="1300" y1="535" x2="1338" y2="515"/>
    <line x1="1300" y1="535" x2="1277" y2="500"/>
    <line x1="1300" y1="535" x2="1262" y2="538"/>
  </g>

  <!-- Desk -->
  <path d="M0 650 L1600 650 L1600 900 L0 900 Z" fill="url(#desk)"/>
  <path d="M0 650 L1600 650 L1600 685 L0 685 Z" fill="#96795c" opacity="0.8"/>

  <!-- Folder shadow -->
  <g filter="url(#shadow)">
    <path d="M545 486 L1060 486 L1107 706 L505 706 Z" fill="#bea145" opacity="0.4"/>
  </g>

  <!-- Folder -->
  <g filter="url(#shadow)">
    <path d="M520 468 L1048 468 L1096 694 L480 694 Z" fill="url(#folder)" stroke="#a97b15" stroke-width="6"/>
    <path d="M595 430 L790 430 L838 487 L560 487 Z" fill="#e6c95c" stroke="#a97b15" stroke-width="6"/>
    <path d="M610 526 L1005 526" stroke="#b68e25" stroke-width="8" opacity="0.95"/>
    <path d="M625 570 L1015 570" stroke="#b68e25" stroke-width="8" opacity="0.95"/>
    <path d="M640 616 L990 616" stroke="#b68e25" stroke-width="8" opacity="0.95"/>
  </g>

  <!-- Clock -->
  <g filter="url(#shadow)">
    <circle cx="1240" cy="336" r="118" fill="#f8fafb" stroke="#a1acb2" stroke-width="10"/>
    <circle cx="1240" cy="336" r="10" fill="#556068"/>
    <g stroke="#a6b0b6" stroke-width="4">
      <line x1="1240" y1="215" x2="1240" y2="232"/>
      <line x1="1240" y1="440" x2="1240" y2="457"/>
      <line x1="1120" y1="336" x2="1137" y2="336"/>
      <line x1="1343" y1="336" x2="1360" y2="336"/>
      <line x1="1156" y1="252" x2="1169" y2="264"/>
      <line x1="1320" y1="252" x2="1307" y2="264"/>
      <line x1="1156" y1="420" x2="1169" y2="408"/>
      <line x1="1320" y1="420" x2="1307" y2="408"/>
    </g>
    <line x1="1240" y1="336" x2="1240" y2="270" stroke="#556068" stroke-width="10" stroke-linecap="round"/>
    <line x1="1240" y1="336" x2="1184" y2="356" stroke="#556068" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Top caption -->
  <text x="72" y="64" class="top">Kui paber on valmis, aga otsus ikka ei taha tulla</text>

  <!-- Folder text -->
  <text x="800" y="560" text-anchor="middle" class="label">KLIIMASEADUS</text>
  <text x="800" y="612" text-anchor="middle" class="sub">ootab otsust</text>

  <!-- Small note -->
  <g opacity="0.85">
    <rect x="150" y="708" width="300" height="90" rx="18" fill="#d6dee3"/>
    <text x="300" y="764" text-anchor="middle" class="small">kooskõlastus</text>
  </g>
</svg>
