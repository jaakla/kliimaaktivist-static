<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="647" viewBox="0 0 1024 647" role="img" aria-labelledby="title desc">
  <title id="title">Kliimapoliitika ja sektoripõhised eesmärgid</title>
  <desc id="desc">Stiilne illustratsioon Euroopa Liidu kliimapoliitika vaidlusest, kus sektorite, sihtmärkide ja paindlikkuse vahel käib vaikselt väga vali vaidlus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff3f2"/>
      <stop offset="100%" stop-color="#f5efe4"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6f68"/>
      <stop offset="100%" stop-color="#7fcdbb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b97a2a"/>
      <stop offset="100%" stop-color="#f2c36d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b2f2a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1024" height="647" fill="url(#bg)"/>
  <circle cx="170" cy="120" r="92" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="840" cy="122" r="122" fill="#fff8e8" fill-opacity="0.85"/>
  <g filter="url(#shadow)">
    <rect x="94" y="112" width="836" height="406" rx="36" fill="#ffffff"/>
  </g>
  <g transform="translate(154 182)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#123f3a">Sektoripõhised eesmärgid vs koondpilt</text>
    <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#54706c">Kui kõigile lubada natuke paindlikkust, siis kasvab ka vajadus täpsema arvestuse järele.</text>
    <g transform="translate(0 82)">
      <rect x="0" y="182" width="640" height="18" rx="9" fill="#d8e8e5"/>
      <rect x="34" y="88" width="78" height="94" rx="14" fill="url(#bars)"/>
      <rect x="154" y="42" width="78" height="140" rx="14" fill="url(#bars)"/>
      <rect x="274" y="110" width="78" height="72" rx="14" fill="url(#bars)"/>
      <rect x="394" y="16" width="78" height="166" rx="14" fill="url(#accent)"/>
      <rect x="514" y="64" width="78" height="118" rx="14" fill="url(#bars)"/>
