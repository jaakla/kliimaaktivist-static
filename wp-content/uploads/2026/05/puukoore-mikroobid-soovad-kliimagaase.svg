<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 647" role="img" aria-labelledby="title desc">
  <title id="title">Puukoore mikroobid söövad kliimagaase</title>
  <desc id="desc">Editorial illustration of a tree trunk with bark microbes, floating climate gas bubbles, and a softly lit forest background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06131f"/>
      <stop offset="55%" stop-color="#12312f"/>
      <stop offset="100%" stop-color="#1f2d1b"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4b2a"/>
      <stop offset="55%" stop-color="#5d351f"/>
      <stop offset="100%" stop-color="#2f1b12"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7bdcb5"/>
      <stop offset="100%" stop-color="#00d084"/>
    </linearGradient>
    <linearGradient id="gas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7f9ff"/>
      <stop offset="100%" stop-color="#8ed1fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
