<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="647" viewBox="0 0 1024 647" role="img" aria-labelledby="title desc">
  <title id="title">Troopiliste metsade kadu aeglustus, kuid tuleoht ei kao</title>
  <desc id="desc">Roheline troopiline mets, suitsupilved ja üks väike leegikaar, mis meenutab, et tuleoht ei kao ise ära.</desc>
