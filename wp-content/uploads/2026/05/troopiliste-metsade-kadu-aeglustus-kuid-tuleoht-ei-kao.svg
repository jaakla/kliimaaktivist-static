      <stop offset="55%" stop-color="#204c3c"/>
      <stop offset="100%" stop-color="#2f7b4f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16311f"/>
      <stop offset="100%" stop-color="#0f1f14"/>
