    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd36a"/>
      <stop offset="55%" stop-color="#ff8c2a"/>
      <stop offset="100%" stop-color="#d8471f"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
