      <stop offset="100%" stop-color="#00d084"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="647" fill="url(#bg)"/>
  <circle cx="160" cy="110" r="70" fill="#ffffff" opacity="0.06"/>
