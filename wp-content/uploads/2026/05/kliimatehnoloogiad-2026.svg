<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 647" role="img" aria-labelledby="title desc">
  <title id="title">Kliimatehnoloogiad 2026</title>
  <desc id="desc">Abstract editorial illustration of a battery, a reactor dome, and a data center.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06223a"/>
      <stop offset="55%" stop-color="#0c4a4f"/>
      <stop offset="100%" stop-color="#15311f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ad6e"/>
      <stop offset="100%" stop-color="#f2dc6f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
